<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — LitByAura</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap"><a href="/" class="logo"><img src="/images/logo.png" class="logo-img" alt="LitByAura"></a></div>
</header>

<section class="section">
  <div class="auth-card">
    <h1 style="text-align:left;">Set a new password</h1>
    <div id="reset-content">
      <form id="reset-form">
        <div class="field password-field"><label for="new-password">New password (min. 6 characters)</label><input id="new-password" type="password" minlength="6" required></div>
        <div class="field password-field"><label for="confirm-password">Confirm new password</label><input id="confirm-password" type="password" minlength="6" required></div>
        <button class="btn btn-primary btn-block" type="submit">Update password</button>
      </form>
    </div>
  </div>
</section>

<script src="/js/main.js"></script>
<script>
const params = new URLSearchParams(location.search);
const token = params.get('token');
const type = params.get('type') === 'admin' ? 'admin' : 'customer';
const confirmEndpoint = type === 'admin' ? '/api/admin/password-reset/confirm' : '/api/customers/password-reset/confirm';
const successLink = type === 'admin' ? '/admin' : '/account.html';

setupPasswordToggles();

if (!token) {
  document.getElementById('reset-content').innerHTML = '<p>This reset link is missing or invalid. Request a new one from the login page.</p>';
} else {
  document.getElementById('reset-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!passwordsMatch('new-password', 'confirm-password')) return;
    try {
      await api(confirmEndpoint, {
        method: 'POST',
        body: JSON.stringify({ token, newPassword: document.getElementById('new-password').value }),
      });
      document.getElementById('reset-content').innerHTML = `<p>Your password has been updated.</p><a href="${successLink}" class="btn btn-primary">Continue</a>`;
    } catch (err) {
      toast(err.message, true);
    }
  });
}
</script>
</body>
</html>
