services:
  - type: web
    name: litbyaura
    runtime: node
    plan: starter # persistent disks require a paid plan - see DEPLOY.md
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true # Render generates a random secret for you
      - key: BASE_URL
        sync: false # set this to your live Render URL after first deploy
      - key: DB_PATH
        value: /var/data/litbyaura.db
      - key: CURRENCY
        value: GHS
      - key: CURRENCY_SYMBOL
        value: GH₵
      - key: EMAIL_PROVIDER
        value: console # switch to smtp + fill in SMTP_* vars when ready
      - key: PAYSTACK_ENABLED
        value: "false"
    disk:
      name: litbyaura-data
      mountPath: /var/data
      sizeGB: 1
